{% extends "partials_layout.html" %}
{% set title = "إعدادات النظام" %}
{% set subtitle = "تخصيص اسم المركز والمنظومة، وإعدادات النسخ الاحتياطي التلقائي" %}
{% block page_content %}
<div id="settingsAlert"></div>

<!-- System & Backup Settings -->
<div class="card panel-card p-4">
    <div class="d-flex align-items-center gap-2 mb-3">
        <div class="feature-icon" style="width: 36px; height: 36px; font-size: 18px;">
            <i class="bi bi-shield-check"></i>
        </div>
        <h5 class="fw-bold mb-0 text-white">إعدادات المنظومة والنسخ الاحتياطي</h5>
    </div>
    <form id="settingsForm">
        <div class="row g-3">
            <div class="col-md-12">
                <label class="form-label">اسم المركز / المنظومة</label>
                <input id="company_name" class="form-control" placeholder="اسم المركز..." required>
            </div>

            <div class="col-12"><hr class="my-2 border-secondary border-opacity-25"></div>
            
            <div class="col-12">
                <h6 class="fw-bold mb-2 text-white">النسخ الاحتياطي التلقائي</h6>
            </div>
            <div class="col-md-12">
                <div class="form-check form-switch p-0 d-flex align-items-center justify-content-between mb-2">
                    <label class="form-check-label fw-semibold text-secondary" for="auto_backup_enabled">تفعيل النسخ الاحتياطي التلقائي اليومي</label>
                    <input id="auto_backup_enabled" class="form-check-input ms-0" type="checkbox" role="switch" style="float: none; width: 2.5em; height: 1.3em;">
                </div>
            </div>
            <div class="col-md-6">
                <label class="form-label">وقت إنشاء النسخة الاحتياطية (يومياً)</label>
                <input id="auto_backup_time" type="time" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">مدة الاحتفاظ بالنسخ (بالأيام)</label>
                <input id="auto_backup_retention_days" type="number" class="form-control" min="1" max="365" required>
            </div>
        </div>
        <button class="btn btn-primary mt-4 rounded-pill px-4">
            <i class="bi bi-save me-1"></i>حفظ إعدادات النظام
        </button>
    </form>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/settings.js?v=6"></script>
{% endblock %}
